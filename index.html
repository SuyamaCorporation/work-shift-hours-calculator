<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>シフト 勤務時間 合計計算</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen p-4">
  <div class="max-w-5xl mx-auto">
    <h1 class="text-2xl font-bold text-gray-800 mb-6">シフト 勤務時間 合計計算</h1>

    <!-- 入力テーブル -->
    <div class="bg-white rounded-lg shadow p-6 mb-6">
      <div class="flex items-center justify-between mb-4">
        <h2 class="text-lg font-semibold text-gray-700">シフト入力</h2>
        <div class="flex gap-2">
          <button id="addRowBtn" class="bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium px-4 py-2 rounded focus:outline-none focus:ring-2 focus:ring-blue-400" tabindex="0" aria-label="行を追加">+ 行追加</button>
          <button id="saveBtn" class="bg-green-600 hover:bg-green-700 text-white text-sm font-medium px-4 py-2 rounded focus:outline-none focus:ring-2 focus:ring-green-400" tabindex="0" aria-label="保存">保存</button>
          <button id="clearBtn" class="bg-red-500 hover:bg-red-600 text-white text-sm font-medium px-4 py-2 rounded focus:outline-none focus:ring-2 focus:ring-red-400" tabindex="0" aria-label="全件削除">全消去</button>
        </div>
      </div>
      <div class="overflow-x-auto">
        <table class="w-full text-sm" role="grid" aria-label="シフト入力テーブル">
          <thead>
            <tr class="bg-gray-100 text-gray-600 text-left">
              <th class="px-2 py-2 font-medium" scope="col">日付</th>
              <th class="px-2 py-2 font-medium" scope="col">曜日</th>
              <th class="px-2 py-2 font-medium" scope="col">出勤</th>
              <th class="px-2 py-2 font-medium" scope="col">退勤</th>
              <th class="px-2 py-2 font-medium" scope="col">休憩(分)</th>
              <th class="px-2 py-2 font-medium" scope="col">法定休日</th>
              <th class="px-2 py-2 font-medium" scope="col">実働(h)</th>
              <th class="px-2 py-2 font-medium" scope="col">深夜(h)</th>
              <th class="px-2 py-2 font-medium" scope="col">週</th>
              <th class="px-2 py-2 font-medium" scope="col">操作</th>
            </tr>
          </thead>
          <tbody id="shiftBody"></tbody>
        </table>
      </div>
    </div>

    <!-- 週別サマリ -->
    <div class="bg-white rounded-lg shadow p-6 mb-6">
      <h2 class="text-lg font-semibold text-gray-700 mb-4">週別サマリ</h2>
      <div class="overflow-x-auto">
        <table class="w-full text-sm" role="grid" aria-label="週別サマリ">
          <thead>
            <tr class="bg-gray-100 text-gray-600 text-left">
              <th class="px-3 py-2 font-medium" scope="col">週番号</th>
              <th class="px-3 py-2 font-medium" scope="col">期間</th>
              <th class="px-3 py-2 font-medium" scope="col">総実働(h)</th>
              <th class="px-3 py-2 font-medium" scope="col">残業(h)</th>
              <th class="px-3 py-2 font-medium" scope="col">深夜割増(h)</th>
              <th class="px-3 py-2 font-medium" scope="col">法定休日出勤(h)</th>
            </tr>
          </thead>
          <tbody id="weekBody">
            <tr><td colspan="6" class="text-center text-gray-400 py-4">データがありません。</td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- 合計サマリ -->
    <div class="bg-white rounded-lg shadow p-6">
      <h2 class="text-lg font-semibold text-gray-700 mb-4">全期間合計</h2>
      <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
        <div class="bg-blue-50 rounded-lg p-4 text-center">
          <div class="text-3xl font-bold text-blue-700" id="totalHours">0.0</div>
          <div class="text-sm text-gray-500 mt-1">総実働時間 (h)</div>
        </div>
        <div class="bg-orange-50 rounded-lg p-4 text-center">
          <div class="text-3xl font-bold text-orange-600" id="totalOvertime">0.0</div>
          <div class="text-sm text-gray-500 mt-1">残業時間 (h)</div>
        </div>
        <div class="bg-purple-50 rounded-lg p-4 text-center">
          <div class="text-3xl font-bold text-purple-600" id="totalNight">0.0</div>
          <div class="text-sm text-gray-500 mt-1">深夜割増 (h)</div>
        </div>
        <div class="bg-red-50 rounded-lg p-4 text-center">
          <div class="text-3xl font-bold text-red-600" id="totalHoliday">0.0</div>
          <div class="text-sm text-gray-500 mt-1">法定休日出勤 (h)</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const WEEK_LIMIT = 40;
    const DAY_NAMES = ['日','月','火','水','木','金','土'];

    let shifts = [];

    function pad(n) { return String(n).padStart(2, '0'); }
    function fmtDate(d) { return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }

    function timeToMin(t) {
      if (!t) return null;
      const [h, m] = t.split(':').map(Number);
      return h * 60 + m;
    }

    function calcNightMins(startMin, endMin) {
      // 深夜: 22:00(1320) - 29:00(1740=翌5:00)
      if (endMin <= startMin) return 0;
      const nightStart = 22 * 60;
      const nightEnd = 24 * 60 + 5 * 60; // 29:00
      // 終業が翌日にまたがる場合
      let actualEnd = endMin;
      if (endMin < startMin) actualEnd = endMin + 24 * 60;
      let nightMin = 0;
      // 22:00以降
      const overlapStart = Math.max(startMin, nightStart);
      const overlapEnd = Math.min(actualEnd, nightEnd);
      if (overlapEnd > overlapStart) nightMin += overlapEnd - overlapStart;
      // 翌0:00〜5:00 (startMinが24:00以前の場合)
      if (startMin < 24 * 60 && actualEnd > 24 * 60) {
        const next5 = 5 * 60;
        const overS2 = 0;
        const overE2 = Math.min(actualEnd - 24 * 60, next5);
        if (overE2 > overS2) nightMin += overE2 - overS2;
      }
      return nightMin;
    }

    function calcRow(shift) {
      const start = timeToMin(shift.start);
      const end = timeToMin(shift.end);
      if (start === null || end === null) return { actual: 0, night: 0 };
      let totalMin = end > start ? end - start : (end + 24 * 60 - start);
      const breakMin = parseInt(shift.breakMin) || 0;
      const actual = Math.max(0, totalMin - breakMin);
      const night = calcNightMins(start, end);
      return { actual: actual / 60, night: Math.min(night, actual) / 60 };
    }

    function getWeekNum(dateStr) {
      if (!dateStr) return 0;
      const d = new Date(dateStr);
      const jan1 = new Date(d.getFullYear(), 0, 1);
      return Math.ceil(((d - jan1) / 86400000 + jan1.getDay() + 1) / 7);
    }

    function getISOWeek(dateStr) {
      if (!dateStr) return '?';
      const d = new Date(dateStr);
      const thu = new Date(d);
      thu.setDate(d.getDate() - ((d.getDay() + 6) % 7) + 3);
      const firstThu = new Date(thu.getFullYear(), 0, 4);
      return Math.round(((thu - firstThu) / 86400000) / 7) + 1;
    }

    function getWeekStart(dateStr) {
      const d = new Date(dateStr);
      const day = d.getDay();
      const diff = day === 0 ? -6 : 1 - day;
      d.setDate(d.getDate() + diff);
      return fmtDate(d);
    }

    function calcAndRender() {
      const tbody = document.getElementById('shiftBody');
      while (tbody.firstChild) tbody.removeChild(tbody.firstChild);

      const weekMap = {};

      shifts.forEach((s, i) => {
        const { actual, night } = calcRow(s);
        const dow = s.date ? DAY_NAMES[new Date(s.date).getDay()] : '-';
        const wk = s.date ? getWeekStart(s.date) : null;
        const isoW = s.date ? `W${String(getISOWeek(s.date)).padStart(2,'0')}` : '-';

        if (wk) {
          if (!weekMap[wk]) weekMap[wk] = { total: 0, night: 0, holiday: 0, dates: [] };
          weekMap[wk].total += actual;
          weekMap[wk].night += night;
          if (s.holiday) weekMap[wk].holiday += actual;
          if (!weekMap[wk].dates.includes(s.date)) weekMap[wk].dates.push(s.date);
        }

        const tr = document.createElement('tr');
        tr.className = i % 2 === 0 ? 'border-b border-gray-100' : 'border-b border-gray-100 bg-gray-50';

        // date input
        const tdDate = document.createElement('td');
        tdDate.className = 'px-1 py-1';
        const inpDate = document.createElement('input');
        inpDate.type = 'date';
        inpDate.value = s.date || '';
        inpDate.className = 'border border-gray-200 rounded px-2 py-1 text-sm w-32 focus:outline-none focus:ring-1 focus:ring-blue-300';
        inpDate.setAttribute('aria-label', `${i+1}行目 日付`);
        inpDate.addEventListener('change', () => { shifts[i].date = inpDate.value; calcAndRender(); });
        tdDate.appendChild(inpDate);

        // dow
        const tdDow = document.createElement('td');
        tdDow.className = 'px-2 py-1 text-center font-medium';
        tdDow.textContent = dow;
        if (dow === '土') tdDow.classList.add('text-blue-500');
        if (dow === '日') tdDow.classList.add('text-red-500');

        // start
        const tdStart = document.createElement('td');
        tdStart.className = 'px-1 py-1';
        const inpStart = document.createElement('input');
        inpStart.type = 'time';
        inpStart.value = s.start || '';
        inpStart.className = 'border border-gray-200 rounded px-2 py-1 text-sm w-28 focus:outline-none focus:ring-1 focus:ring-blue-300';
        inpStart.setAttribute('aria-label', `${i+1}行目 出勤時刻`);
        inpStart.addEventListener('change', () => { shifts[i].start = inpStart.value; calcAndRender(); });
        tdStart.appendChild(inpStart);

        // end
        const tdEnd = document.createElement('td');
        tdEnd.className = 'px-1 py-1';
        const inpEnd = document.createElement('input');
        inpEnd.type = 'time';
        inpEnd.value = s.end || '';
        inpEnd.className = 'border border-gray-200 rounded px-2 py-1 text-sm w-28 focus:outline-none focus:ring-1 focus:ring-blue-300';
        inpEnd.setAttribute('aria-label', `${i+1}行目 退勤時刻`);
        inpEnd.addEventListener('change', () => { shifts[i].end = inpEnd.value; calcAndRender(); });
        tdEnd.appendChild(inpEnd);

        // break
        const tdBreak = document.createElement('td');
        tdBreak.className = 'px-1 py-1';
        const inpBreak = document.createElement('input');
        inpBreak.type = 'number';
        inpBreak.min = '0';
        inpBreak.value = s.breakMin || '60';
        inpBreak.className = 'border border-gray-200 rounded px-2 py-1 text-sm w-16 focus:outline-none focus:ring-1 focus:ring-blue-300';
        inpBreak.setAttribute('aria-label', `${i+1}行目 休憩分`);
        inpBreak.addEventListener('change', () => { shifts[i].breakMin = inpBreak.value; calcAndRender(); });
        tdBreak.appendChild(inpBreak);

        // holiday checkbox
        const tdHoliday = document.createElement('td');
        tdHoliday.className = 'px-2 py-1 text-center';
        const chk = document.createElement('input');
        chk.type = 'checkbox';
        chk.checked = !!s.holiday;
        chk.className = 'w-4 h-4';
        chk.setAttribute('aria-label', `${i+1}行目 法定休日`);
        chk.addEventListener('change', () => { shifts[i].holiday = chk.checked; calcAndRender(); });
        tdHoliday.appendChild(chk);

        // actual
        const tdActual = document.createElement('td');
        tdActual.className = 'px-2 py-1 text-right font-mono';
        tdActual.textContent = actual.toFixed(2);

        // night
        const tdNight = document.createElement('td');
        tdNight.className = 'px-2 py-1 text-right font-mono text-purple-600';
        tdNight.textContent = night > 0 ? night.toFixed(2) : '-';

        // week
        const tdWk = document.createElement('td');
        tdWk.className = 'px-2 py-1 text-center text-xs text-gray-400';
        tdWk.textContent = isoW;

        // del
        const tdDel = document.createElement('td');
        tdDel.className = 'px-2 py-1';
        const delBtn = document.createElement('button');
        delBtn.textContent = '削除';
        delBtn.className = 'text-red-500 hover:text-red-700 text-xs underline focus:outline-none';
        delBtn.setAttribute('aria-label', `${i+1}行目を削除`);
        delBtn.setAttribute('tabindex', '0');
        delBtn.addEventListener('click', () => { shifts.splice(i, 1); calcAndRender(); });
        tdDel.appendChild(delBtn);

        [tdDate, tdDow, tdStart, tdEnd, tdBreak, tdHoliday, tdActual, tdNight, tdWk, tdDel].forEach(td => tr.appendChild(td));
        tbody.appendChild(tr);
      });

      // 週別サマリ
      const wbody = document.getElementById('weekBody');
      while (wbody.firstChild) wbody.removeChild(wbody.firstChild);
      const weekKeys = Object.keys(weekMap).sort();
      let totalH = 0, totalOT = 0, totalNight = 0, totalHoliday = 0;
      if (weekKeys.length === 0) {
        const tr = document.createElement('tr');
        const td = document.createElement('td');
        td.colSpan = 6; td.className = 'text-center text-gray-400 py-4'; td.textContent = 'データがありません。';
        tr.appendChild(td); wbody.appendChild(tr);
      } else {
        weekKeys.forEach((wk, wi) => {
          const w = weekMap[wk];
          const ot = Math.max(0, w.total - WEEK_LIMIT);
          totalH += w.total; totalOT += ot; totalNight += w.night; totalHoliday += w.holiday;
          const dates = w.dates.sort();
          const period = dates.length > 0 ? `${dates[0]} 〜 ${dates[dates.length-1]}` : wk;
          const tr = document.createElement('tr');
          tr.className = wi % 2 === 0 ? 'border-b border-gray-100' : 'border-b border-gray-100 bg-gray-50';
          const cells = [
            `W${String(getISOWeek(wk)).padStart(2,'0')}`,
            period,
            w.total.toFixed(2),
            ot > 0 ? ot.toFixed(2) : '-',
            w.night > 0 ? w.night.toFixed(2) : '-',
            w.holiday > 0 ? w.holiday.toFixed(2) : '-',
          ];
          cells.forEach((txt, ci) => {
            const td = document.createElement('td');
            td.className = 'px-3 py-2' + (ci === 3 && ot > 0 ? ' text-orange-600 font-semibold' : '');
            td.textContent = txt;
            tr.appendChild(td);
          });
          wbody.appendChild(tr);
        });
      }
      document.getElementById('totalHours').textContent = totalH.toFixed(2);
      document.getElementById('totalOvertime').textContent = totalOT.toFixed(2);
      document.getElementById('totalNight').textContent = totalNight.toFixed(2);
      document.getElementById('totalHoliday').textContent = totalHoliday.toFixed(2);
    }

    document.getElementById('addRowBtn').addEventListener('click', () => {
      const today = new Date();
      const pad = n => String(n).padStart(2,'0');
      shifts.push({ date: `${today.getFullYear()}-${pad(today.getMonth()+1)}-${pad(today.getDate())}`, start: '09:00', end: '18:00', breakMin: '60', holiday: false });
      calcAndRender();
    });

    document.getElementById('saveBtn').addEventListener('click', () => {
      localStorage.setItem('shift_calc_v1', JSON.stringify(shifts));
      const btn = document.getElementById('saveBtn');
      btn.textContent = '保存済み!';
      setTimeout(() => { btn.textContent = '保存'; }, 1500);
    });

    document.getElementById('clearBtn').addEventListener('click', () => {
      if (!confirm('全件削除しますか？')) return;
      shifts = [];
      localStorage.removeItem('shift_calc_v1');
      calcAndRender();
    });

    // Load
    try {
      const d = localStorage.getItem('shift_calc_v1');
      if (d) shifts = JSON.parse(d);
    } catch(e) { shifts = []; }
    if (shifts.length === 0) {
      const today = new Date();
      const pad = n => String(n).padStart(2,'0');
      shifts.push({ date: `${today.getFullYear()}-${pad(today.getMonth()+1)}-${pad(today.getDate())}`, start: '09:00', end: '18:00', breakMin: '60', holiday: false });
    }
    calcAndRender();
  </script>
</body>
</html>
